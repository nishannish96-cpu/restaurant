<!-- ORDER HISTORY TAB -->
<section id="tab-order-history" class="tab-section" style="display:none; padding:20px;">
  <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px;">
    <div>
      <h2 style="margin:0; color:#065f46;">Order History & Invoices</h2>
      <p style="margin:4px 0 0; font-size:13px; color:#6b7280;">All completed and cancelled orders synced with Firebase Cloud.</p>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <input type="text" id="history-search" placeholder="Search INV#, Table, or Dish..." oninput="renderOrderHistory()"
        style="padding:8px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px;">
      <select id="history-date-filter" onchange="renderOrderHistory()"
        style="padding:8px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px;">
        <option value="today">Today</option>
        <option value="week">Last 7 Days</option>
        <option value="all">All Time</option>
      </select>
      <select id="history-status-filter" onchange="renderOrderHistory()"
        style="padding:8px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px;">
        <option value="all">All Statuses</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button onclick="exportHistoryCSV()"
        style="background:#059669; color:#fff; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600;">
        ⬇ Export CSV
      </button>
    </div>
  </div>

  <!-- Summary Cards -->
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:16px;">
    <div style="background:#ecfdf5; border:1px solid #a7f3d0; padding:14px; border-radius:10px;">
      <div style="font-size:12px; color:#065f46;">Total Orders</div>
      <div id="hist-total-count" style="font-size:22px; font-weight:700; color:#047857;">0</div>
    </div>
    <div style="background:#ecfdf5; border:1px solid #a7f3d0; padding:14px; border-radius:10px;">
      <div style="font-size:12px; color:#065f46;">Gross Revenue (Incl. VAT)</div>
      <div id="hist-total-sales" style="font-size:22px; font-weight:700; color:#047857;">SAR 0.00</div>
    </div>
    <div style="background:#f9fafb; border:1px solid #e5e7eb; padding:14px; border-radius:10px;">
      <div style="font-size:12px; color:#374151;">Total VAT (15%)</div>
      <div id="hist-total-vat" style="font-size:22px; font-weight:700; color:#111827;">SAR 0.00</div>
    </div>
  </div>

  <!-- Orders Table -->
  <div style="overflow-x:auto; background:#fff; border:1px solid #e5e7eb; border-radius:10px;">
    <table style="width:100%; border-collapse:collapse; font-size:14px; text-align:left;">
      <thead style="background:#f0fdf4; color:#065f46; border-bottom:1px solid #d1fae5;">
        <tr>
          <th style="padding:12px;">Invoice #</th>
          <th style="padding:12px;">Date & Time</th>
          <th style="padding:12px;">Table / Type</th>
          <th style="padding:12px;">Items</th>
          <th style="padding:12px;">Total</th>
          <th style="padding:12px;">Status</th>
          <th style="padding:12px; text-align:right;">Actions</th>
        </tr>
      </thead>
      <tbody id="order-history-tbody"></tbody>
    </table>
  </div>
</section>

<!-- ITEMIZED ORDER DETAIL MODAL -->
<div id="order-detail-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center; padding:16px;">
  <div style="background:#fff; width:100%; max-width:520px; border-radius:12px; overflow:hidden; box-shadow:0 20px 25px rgba(0,0,0,0.2);">
    <div style="background:#065f46; color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center;">
      <h3 id="modal-order-title" style="margin:0; font-size:16px;">Order Details</h3>
      <button onclick="closeOrderModal()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
    </div>
    <div id="modal-order-body" style="padding:18px; max-height:65vh; overflow-y:auto; font-size:14px;"></div>
    <div style="padding:12px 18px; background:#f9fafb; border-top:1px solid #e5e7eb; display:flex; justify-content:flex-end; gap:10px;">
      <button onclick="closeOrderModal()" style="padding:8px 14px; border:1px solid #d1d5db; background:#fff; border-radius:8px; cursor:pointer;">Close</button>
      <button id="modal-reprint-btn" style="padding:8px 16px; border:none; background:#059669; color:#fff; border-radius:8px; cursor:pointer; font-weight:600;">
        🖨 Reprint 80mm Receipt
      </button>
    </div>
  </div>
</div>
